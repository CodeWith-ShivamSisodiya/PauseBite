name: Build verified PauseBite release

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: pausebite-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      PB_KEYSTORE_BASE64: ${{ secrets.PAUSEBITE_KEYSTORE_BASE64 }}
      PAUSEBITE_KEYSTORE_PASSWORD: ${{ secrets.PAUSEBITE_KEYSTORE_PASSWORD }}
      PAUSEBITE_KEY_ALIAS: ${{ secrets.PAUSEBITE_KEY_ALIAS }}
      PAUSEBITE_KEY_PASSWORD: ${{ secrets.PAUSEBITE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -n "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"

      - name: Require persistent upload key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$PB_KEYSTORE_BASE64" ] || [ -z "$PAUSEBITE_KEYSTORE_PASSWORD" ] || [ -z "$PAUSEBITE_KEY_ALIAS" ] || [ -z "$PAUSEBITE_KEY_PASSWORD" ]; then
            echo "::error::Configure all four PAUSEBITE signing secrets before producing a release."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/pausebite-upload.p12"
          printf '%s' "$PB_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$PAUSEBITE_KEYSTORE_PASSWORD" -alias "$PAUSEBITE_KEY_ALIAS" > /dev/null
          echo "PAUSEBITE_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Lint and build signed APK and app bundle
        run: gradle --no-daemon :app:lintRelease :app:assembleRelease :app:bundleRelease

      - name: Verify identity, signature, and minimum permissions
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          AAPT="$(find "$SDK_ROOT/build-tools" -name aapt -type f | sort -V | tail -n 1)"

          test -s "$APK"
          test -s "$AAB"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signing-certificate.txt
          EXPECTED_CERT="$(keytool -exportcert -keystore "$PAUSEBITE_KEYSTORE_FILE" -storepass "$PAUSEBITE_KEYSTORE_PASSWORD" -alias "$PAUSEBITE_KEY_ALIAS" | sha256sum | cut -d' ' -f1)"
          # apksigner labels this line differently across versions/signing schemes,
          # for example "Signer #1 certificate..." or "V2 Signer: certificate...".
          ACTUAL_CERT="$(awk '/Signer.*certificate SHA-256 digest:/ { print tolower($NF); exit }' apk-signing-certificate.txt)"
          if [ -z "$ACTUAL_CERT" ]; then
            echo "::error::Unable to read the APK signer certificate SHA-256 digest."
            exit 1
          fi
          if [ "$EXPECTED_CERT" != "$ACTUAL_CERT" ]; then
            echo "::error::The release APK was not signed by the configured upload key."
            exit 1
          fi

          "$AAPT" dump badging "$APK" | tee apk-metadata.txt
          EXPECTED_VERSION="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$EXPECTED_VERSION"
          grep -Fq "package: name='com.pausebite.app' versionCode='$EXPECTED_VERSION'" apk-metadata.txt
          grep -Fq "targetSdkVersion:'36'" apk-metadata.txt
          grep -Fq "application-icon" apk-metadata.txt

          "$AAPT" dump permissions "$APK" | tee apk-permissions.txt
          for permission in \
            android.permission.PACKAGE_USAGE_STATS \
            android.permission.FOREGROUND_SERVICE \
            android.permission.FOREGROUND_SERVICE_SPECIAL_USE \
            android.permission.POST_NOTIFICATIONS; do
            grep -Fq "name='$permission'" apk-permissions.txt
          done
          if grep -Eq 'android.permission.(SYSTEM_ALERT_WINDOW|INTERNET|QUERY_ALL_PACKAGES|BIND_ACCESSIBILITY_SERVICE|READ_SMS|RECEIVE_SMS|READ_CONTACTS|ACCESS_FINE_LOCATION)' apk-permissions.txt; then
            echo "::error::Unexpected high-risk permission in release APK"
            exit 1
          fi

          sha256sum "$APK" "$AAB" | tee artifact-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PauseBite-Play-Internal-Testing
          path: |
            app/build/outputs/bundle/release/app-release.aab
            artifact-sha256.txt
            apk-signing-certificate.txt
            apk-metadata.txt
            apk-permissions.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: PauseBite-sideload-diagnostic-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
