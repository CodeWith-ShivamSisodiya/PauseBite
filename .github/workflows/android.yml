name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: pausebite-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android command line tools
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fL --retry 3 -o /tmp/commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/commandlinetools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses >/dev/null || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Restore signing key if configured
        env:
          KEYSTORE_B64: ${{ secrets.PAUSEBITE_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pausebite-release.jks"
          echo "PAUSEBITE_KEYSTORE_FILE=$RUNNER_TEMP/pausebite-release.jks" >> "$GITHUB_ENV"
      - name: Build persistent signed release APK
        if: env.PAUSEBITE_KEYSTORE_FILE != ''
        env:
          PAUSEBITE_KEYSTORE_PASSWORD: ${{ secrets.PAUSEBITE_KEYSTORE_PASSWORD }}
          PAUSEBITE_KEY_ALIAS: ${{ secrets.PAUSEBITE_KEY_ALIAS }}
          PAUSEBITE_KEY_PASSWORD: ${{ secrets.PAUSEBITE_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: PauseBite-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: env.PAUSEBITE_KEYSTORE_FILE != ''
        with:
          name: PauseBite-signed-update-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
